name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Build binaries for multiple platforms
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../fileview-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }} fv
          cd ../../..

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path fv.exe -DestinationPath ../../../fileview-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fileview-${{ matrix.target }}
          path: fileview-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  # Create GitHub Release
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        id: release_notes
        run: |
          # Extract version from tag
          VERSION="${{ github.ref_name }}"
          VER_NUM="${VERSION#v}"

          # Extract the changelog section for this version.
          # State-machine scan: turn on when we see the matching header,
          # turn off (and exit) on the next "## " header. The previous
          # range-based pattern collapsed to one line because the start
          # header (e.g. "## [2.7.0]") also matched the end pattern.
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v ver="$VER_NUM" '
              $0 ~ "^## \\[" ver "\\]" || $0 ~ "^## " ver "( |$)" { in_section = 1; next }
              in_section && /^## / { exit }
              in_section { print }
            ' CHANGELOG.md)
            if [ -z "$NOTES" ]; then
              NOTES="Release ${VERSION}"
            fi
          else
            NOTES="Release ${VERSION}"
          fi

          # Save to file for multiline support
          echo "$NOTES" > release_notes.md

      - name: Create SHA256 checksums
        run: |
          cd artifacts
          sha256sum fileview-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            artifacts/fileview-*
            artifacts/checksums-sha256.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true

# Note: crates.io publishing is done manually (`cargo publish --no-verify`)
# so the release timing can be controlled without keeping a
# `CARGO_REGISTRY_TOKEN` secret in GitHub Actions.
