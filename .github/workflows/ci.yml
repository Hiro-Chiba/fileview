name: CI

# Orchestrator for the required "CI Success" check. It classifies the
# changed files, calls only the checks whose inputs changed, and the gate
# job turns their results into the single status the ruleset requires.
# Pushes to main skip classification and run every check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    name: Classify Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
    steps:
      - name: Detect changes that affect the build
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # Everything the crate, its tests, or the PTY smoke scripts read.
          # A change to any CI workflow fires every check as a canary.
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'scripts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - '.cargo/**'
              - '.github/workflows/ci*.yml'

  lint:
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    uses: ./.github/workflows/ci-lint.yml

  test:
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    uses: ./.github/workflows/ci-test.yml

  msrv:
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    uses: ./.github/workflows/ci-msrv.yml

  # The single required status check. Skipped checks pass, so a PR that
  # only touches docs or demos goes green without building. Any check that
  # fails or is cancelled, or a failed classification, blocks the merge.
  ci-success:
    name: CI Success
    needs: [classify, lint, test, msrv]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify every fired check succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          FAILED=$(echo "$NEEDS_JSON" | jq -r 'to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled"
                     or (.key == "classify" and .value.result != "success"))
            | .key')
          if [ -n "$FAILED" ]; then
            echo "::error::Checks did not pass: $(echo "$FAILED" | tr '\n' ' ')"
            exit 1
          fi
          echo "All fired checks are green."
