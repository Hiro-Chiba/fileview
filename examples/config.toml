# FileView Configuration Example
# Copy this file to ~/.config/fileview/config.toml

[general]
# Show hidden files on start
show_hidden = false

# Show Nerd Font icons next to file names (needs a Nerd Font)
enable_icons = true

# Capture the mouse for clicks, scrolling, and drops
mouse_enabled = true

# Shell commands that replace the built-in preview for an extension.
# $f is replaced with the shell-escaped file path. Output is shown as plain text.
[preview.custom]
# csv = "column -s, -t $f | head -50"
# log = "tail -n 200 $f"

[performance]
# Git status refresh interval in seconds
git_poll_interval_secs = 5

[budget]
# Model for the token budget bar: sonnet, sonnet-1m, opus, haiku
# default_model = "sonnet"
