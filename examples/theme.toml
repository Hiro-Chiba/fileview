# FileView Theme Example
# Copy this file to ~/.config/fileview/theme.toml
#
# Color formats:
# - Named: "black", "red", "green", "yellow", "blue", "magenta" (or "purple"),
#   "cyan", "white", "gray" (light gray), "darkgray", and "light" variants
#   such as "lightblue"
# - Hex: "#fff" or "#ffffff"
# - RGB: "rgb(255, 255, 255)"
# - 256 colors: "color240" or "240"
# - "default" or "reset" keeps the terminal color

[colors]
selection = "darkgray"     # Background of the focused row
border = "default"         # Panel borders
border_active = "cyan"     # Border of the focused panel
warning = "yellow"         # Warning messages
info = "blue"              # Info messages
help_key_fg = "black"      # Key labels in the help popup
help_key_bg = "cyan"

[file_colors]
directory = "blue"

[git_colors]
modified = "yellow"
staged = "green"
untracked = "green"
deleted = "red"
renamed = "cyan"
conflict = "magenta"
ignored = "darkgray"

